on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.SHARED_AI_PROXY_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.SHARED_AI_PROXY_HOST }}
          config.model: ${{ vars.SHARED_AI_PROXY_MODEL }}
          config.reasoning_effort: "medium"
          config.fallback_models: '["${{ vars.SHARED_AI_PROXY_MODEL_FALLBACKS }}"]'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
